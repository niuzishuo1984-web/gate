name: Safeguard gate-edgetunnel logging settings (no deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate-edgetunnel-settings
  cancel-in-progress: false
jobs:
  safeguard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT: '45a90a0900f07418cb0bb622a8437081'
      CF_SCRIPT: 'gate-edgetunnel'
      CF_TOKEN: ${{ secrets.CLOUDFLARE_EDGETUNNEL_DEPLOY_TOKEN }}
    steps:
      - name: Explicitly disable logging; verify deployment remains unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          d="$(mktemp -d "${RUNNER_TEMP}/gate-safeguard.XXXXXX")"
          trap 'rm -rf -- "$d"' EXIT HUP INT TERM
          [[ -n "${CF_TOKEN:-}" ]] || { echo 'ERROR: deployment token absent'; exit 1; }
          printf 'Authorization: Bearer %s\n' "$CF_TOKEN" > "$d/auth"
          unset CF_TOKEN
          base="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${CF_SCRIPT}"
          get() {
            local name="$1" path="$2" status
            if ! status="$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 45 -H "@$d/auth" -H 'Accept: application/json' -o "$d/$name.json" -w '%{http_code}' "$base$path" 2>"$d/$name.err")"; then
              echo "ERROR: $name request failed, HTTP ${status:-unknown}. No automatic retry." >&2; exit 1
            fi
            [[ "$status" == 200 ]] || { echo "ERROR: $name HTTP $status" >&2; exit 1; }
          }
          get settings_before '/script-settings'
          get deployments_before '/deployments?per_page=1'
          get versions_before '/versions?per_page=1'
          get active '/versions/a1fd22b0-0143-4fb3-90fe-8412825161f8'
          get staged '/versions/f7d3a4d4-6c89-47ef-9ba5-1fddbe6f2682'
          python3 - "$d" <<'PY'
          import json,sys
          from pathlib import Path
          d=Path(sys.argv[1])
          def fail(m): raise SystemExit('ERROR: preflight '+m+'; settings not changed')
          def result(n):
              try:
                  obj=json.loads((d/(n+'.json')).read_text())
                  assert obj['success'] is True and isinstance(obj['result'],dict)
                  return obj['result']
              except Exception: fail('invalid '+n+' response')
          dep=result('deployments_before').get('deployments')
          if not isinstance(dep,list) or not dep or not isinstance(dep[0],dict): fail('deployment response structure')
          av=dep[0].get('versions')
          if not isinstance(av,list) or len(av)!=1 or not isinstance(av[0],dict) or av[0].get('version_id')!='a1fd22b0-0143-4fb3-90fe-8412825161f8' or av[0].get('percentage')!=100:
              fail('active deployment differs')
          versions=result('versions_before').get('items')
          if not versions or versions[0].get('id')!='f7d3a4d4-6c89-47ef-9ba5-1fddbe6f2682': fail('latest version differs')
          expected={'ADMIN':('secret_text',None),'KEY':('secret_text',None),'KV':('kv_namespace','7753e217441a4e948e62eee3d262b5e0'),'OFF_LOG':('plain_text',None)}
          for n in ('active','staged'):
              r=result(n).get('resources',{})
              b=r.get('bindings')
              if isinstance(b,dict): entries=list(b.items())
              elif isinstance(b,list): entries=[(x.get('name'),x) for x in b if isinstance(x,dict)]
              else: fail(n+' bindings')
              observed={k:(v.get('type'),v.get('namespace_id') if v.get('type')=='kv_namespace' else None) for k,v in entries}
              if len(entries)!=len(observed) or observed!=expected: fail(n+' binding mismatch')
              for k,v in entries:
                  if k=='OFF_LOG' and 'text' in v and v['text']!='1': fail(n+' OFF_LOG mismatch')
              runtime=r.get('script_runtime',{})
              if runtime.get('compatibility_date')!='2026-11-25' or runtime.get('compatibility_flags',[])!=[]: fail(n+' runtime mismatch')
          s=result('settings_before')
          if s.get('logpush') is not False: fail('Logpush not explicitly false')
          if s.get('tail_consumers') not in (None,[]): fail('tail consumers configured')
          o=s.get('observability')
          if o is not None:
              if not isinstance(o,dict) or o.get('enabled') is True: fail('observability enabled or invalid')
              for name in ('logs','traces','issues','agents'):
                  part=o.get(name)
                  if part is not None and (not isinstance(part,dict) or part.get('enabled') is True): fail(name+' enabled or invalid')
          print('Preflight passed: active and latest version pins, bindings, runtime, and no enabled exports.')
          PY
          cat > "$d/payload.json" <<'JSON'
          {"logpush":false,"tail_consumers":[],"observability":{"enabled":false,"agents":{"enabled":false,"persist":false},"issues":{"enabled":false},"logs":{"enabled":false,"invocation_logs":false,"persist":false,"destinations":[]},"traces":{"enabled":false,"persist":false,"destinations":[]}}}
          JSON
          if ! status="$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 45 -X PATCH -H "@$d/auth" -H 'Content-Type: application/json' --data-binary "@$d/payload.json" -o "$d/patch.json" -w '%{http_code}' "$base/script-settings" 2>"$d/patch.err")"; then
            echo "ERROR: settings PATCH failed or outcome uncertain, HTTP ${status:-unknown}; inspect before retrying." >&2; exit 1
          fi
          [[ "$status" == 200 ]] || { echo "ERROR: settings PATCH HTTP $status; inspect before retrying." >&2; exit 1; }
          get settings_after '/script-settings'
          get deployments_after '/deployments?per_page=1'
          get versions_after '/versions?per_page=1'
          python3 - "$d" <<'PY'
          import json,sys
          from pathlib import Path
          d=Path(sys.argv[1])
          def fail(m): raise SystemExit('ERROR: post-PATCH verification '+m+'; no deployment attempted; inspect live state')
          def result(n):
              try:
                  obj=json.loads((d/(n+'.json')).read_text()); assert obj['success'] is True and isinstance(obj['result'],dict); return obj['result']
              except Exception: fail('invalid '+n+' response')
          result('patch')
          if result('deployments_before').get('deployments') != result('deployments_after').get('deployments'): fail('deployment changed')
          before=result('versions_before').get('items'); after=result('versions_after').get('items')
          if not before or not after or before[0].get('id')!=after[0].get('id'): fail('latest version changed')
          s=result('settings_after'); o=s.get('observability')
          before_settings=result('settings_before')
          allowed={('logpush',),('tail_consumers',),('observability','enabled'),('observability','agents','enabled'),('observability','agents','persist'),('observability','issues','enabled'),('observability','logs','enabled'),('observability','logs','invocation_logs'),('observability','logs','persist'),('observability','logs','destinations'),('observability','traces','enabled'),('observability','traces','persist'),('observability','traces','destinations')}
          DROP=object()
          def untouched(x,path=()):
              if path in allowed: return DROP
              if path==('observability',) and x is None: return DROP
              if isinstance(x,dict):
                  out={}
                  for k,v in x.items():
                      y=untouched(v,path+(k,))
                      if y is not DROP: out[k]=y
                  return out if out else DROP
              return x
          def safe_summary(v):
              obs=v.get('observability')
              return {'logpush':v.get('logpush','absent'),'tail_consumers_state':'null' if v.get('tail_consumers') is None else ('empty' if v.get('tail_consumers')==[] else 'nonempty-or-invalid'),'observability':obs}
          print('PATCH settings response:',json.dumps(safe_summary(result('patch')),sort_keys=True))
          print('GET settings after:',json.dumps(safe_summary(s),sort_keys=True))
          if untouched(s)!=untouched(before_settings): fail('unrelated settings changed')
          if s.get('logpush') is not False or s.get('tail_consumers') != []: fail('Logpush or tail consumers not explicitly disabled')
          if not isinstance(o,dict) or o.get('enabled') is not False: fail('observability not explicitly false')
          for name in ('logs','traces','issues','agents'):
              part=o.get(name)
              if not isinstance(part,dict) or part.get('enabled') is not False: fail(name+' not explicitly false')
          for name in ('logs','traces'):
              part=o[name]
              if part.get('persist') is not False or part.get('destinations') != []: fail(name+' persistence or destinations not explicitly disabled')
          if o['agents'].get('persist') is not False: fail('agents persistence not explicitly false')
          if o['logs'].get('invocation_logs') is not False: fail('invocation logs not explicitly false')
          print('Explicitly disabled observability/logs/traces/issues/agents and Logpush; persistence disabled, no destinations or tail consumers. Active deployment and latest version unchanged. No deployment created.')
          PY
