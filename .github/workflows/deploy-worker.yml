name: Deploy gate-node-check Worker

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-worker.yml'
      - 'build_checked_worker.py'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gate-node-check
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify audited build and configuration
        shell: bash
        run: |
          set -euo pipefail
          echo 'fa67ed66137cbd84e491102e753e6f651f97f219ea5aa3cea138845a49a97c10  build_checked_worker.py' | sha256sum -c -
          echo 'd721324a2894f2488ae66b3ddd478fc7192b7f3340c3457daf796cf72a3c47f9  wrangler.toml' | sha256sum -c -

      - name: Build and verify Worker
        shell: bash
        run: python3 build_checked_worker.py

      - name: Deploy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '45a90a0900f07418cb0bb622a8437081'
        run: npx --yes wrangler@4.45.0 deploy --config wrangler.toml
